name: Offline Python tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile package
        run: python -m compileall -q battery_control_guard scripts tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check disarmed example config
        run: python -m battery_control_guard.app --config config.example.toml --check-config
      - name: Check inert installer
        run: sh install.sh --dry-run
      - name: Public privacy audit
        run: python scripts/release_audit.py
